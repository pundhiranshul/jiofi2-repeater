# ==============================================================================
# JioFi 2 (M2S) Wi-Fi Repeater Configuration
# ==============================================================================

# Uplink Wi-Fi Network (The Wi-Fi network or Phone Hotspot to repeat)
SSID="MyUplinkWiFi"
PASS="MyWiFiPassword"

# Wi-Fi Channel of the uplink network (1, 6, or 11 recommended)
# Must match your main router / phone hotspot's 2.4 GHz channel
CHAN="6"

# Virtual STA interface MAC address (wlan0-vxd)
# Should be distinct from the physical MAC (usually ending in an odd hex digit)
MAC="BC:8A:E8:13:21:27"

# Fallback static IP settings in case uplink DHCP takes time
FALLBACK_IP="10.21.0.137"
FALLBACK_GW="10.21.0.48"

# Device Hostname announced to uplink router / phone via DHCP Option 12
HOSTNAME="JioFiRepeater"
